name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Gutterlight.xcodeproj \
            -scheme Gutterlight \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build unsigned IPA (device, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Gutterlight.xcodeproj \
            -scheme Gutterlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/Gutterlight.app Payload/
          zip -qry Gutterlight.ipa Payload
          ls -lh Gutterlight.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gutterlight-ipa
          path: Gutterlight.ipa

      - name: Publish versioned release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp Gutterlight.ipa "Gutterlight-${TAG}.ipa"
          gh release create "$TAG" "Gutterlight-${TAG}.ipa" \
            --target "$GITHUB_SHA" \
            --title "Gutterlight ${TAG}" \
            --notes "$(git log -1 --pretty=%B "$GITHUB_SHA" | sed '/^Co-Authored-By:/d;/^Claude-Session:/d')" \
            --latest=false

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Gutterlight.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Gutterlight (latest build)" \
            --notes "Unsigned build van ${GITHUB_SHA::7}. Sideload met AltStore, SideStore of Sideloadly."

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
